name: Backend

# Ejecuta las pruebas del backend con YouTube SIMULADO. No usa secretos: las pruebas reales
# (`npm run test:real`) consumen cuota de YouTube y se ejecutan solo de forma manual en un equipo con backend/.env.
on:
  push:
    branches: [develop, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Verificar que no hay claves de API en el código
        working-directory: .
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- . ':!*.md'; then
            echo "Se encontró una posible clave de API versionada." >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas (unitarias, HTTP y contrato de eventos)
        run: npm test
