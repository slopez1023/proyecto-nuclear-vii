# PostgreSQL 16 para desarrollo y pruebas locales del backend (E4).
# Uso: npm run db:up  →  espera a que el healthcheck esté "healthy"  →  npm run migrar && npm test
# Puerto en el equipo: 5433 (para no chocar con un PostgreSQL instalado localmente en 5432).
# Credenciales SOLO para desarrollo local; en despliegue se usan secretos (ver README).
services:
  postgres:
    image: postgres:16
    container_name: ponga-postgres
    environment:
      POSTGRES_USER: ponga
      POSTGRES_PASSWORD: ponga
      POSTGRES_DB: ponga
    ports:
      - "5433:5432"
    volumes:
      - ponga-pgdata:/var/lib/postgresql/data
      - ./docker/crear-base-pruebas.sql:/docker-entrypoint-initdb.d/01-crear-base-pruebas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ponga -d ponga"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ponga-pgdata:
