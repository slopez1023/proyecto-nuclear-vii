<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a0f">
<title>PONGA — Participación musical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Tokens tomados del prototipo de Figma (docs/diseño-ui/figma) */
  :root{--canvas:#090a0f;--surface:#12151d;--surface2:#171b25;--line:#252b3a;--text:#f6f7fb;--text2:#b7bdcb;--muted:#7e8799;--accent:#8b7cff;--accent-soft:rgba(139,124,255,.13);--danger:#ff6e82;--success:#48d7a0;--r:14px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--canvas);color:var(--text);font-family:Manrope,system-ui,sans-serif;min-height:100vh}
  main{max-width:640px;margin:0 auto;padding:16px}
  .brand{width:112px;height:44px;border-radius:10px;overflow:hidden;background:var(--canvas)}
  .brand img{width:100%;height:100%;object-fit:cover;object-position:center 52%}
  h1{font-size:1.6rem;line-height:1.2;margin:24px 0 8px}
  p{color:var(--text2);line-height:1.5}
  .badge{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:4px 12px;font-size:.8rem;font-weight:700}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:16px}
  .err{border-color:var(--danger)}
  .err h1{color:var(--danger)}
  input{width:100%;height:52px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface2);color:var(--text);font:inherit;padding:0 16px;font-size:1rem}
  input:focus{outline:2px solid var(--accent);border-color:transparent}
  button{height:52px;border:0;border-radius:var(--r);background:var(--accent);color:#0b0a14;font:inherit;font-weight:800;padding:0 20px;cursor:pointer;min-width:48px}
  .row{display:flex;gap:8px}
  ul{list-style:none;margin:8px 0 0;padding:0}
  .sug li{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
  .sug{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .song{display:flex;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:8px;align-items:center}
  .song img{width:96px;height:54px;border-radius:10px;object-fit:cover;background:var(--surface2);flex:none}
  .song .t{font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .song .m{color:var(--muted);font-size:.85rem;margin-top:2px}
  .nd{opacity:.55}
  .privacy{color:var(--muted);font-size:.8rem;margin-top:24px}
</style>
</head>
<body>
<main id="app" aria-live="polite"><p>Cargando…</p></main>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var token = (location.pathname.match(/^\/s\/([A-Za-z0-9_-]+)/) || [])[1];
  var sesion = null;

  function el(html) { var d = document.createElement('div'); d.innerHTML = html; return d; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function brand() { return '<div class="brand"><img src="/ponga-logo.png" alt="PONGA"></div>'; }
  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    var b = crypto.getRandomValues(new Uint8Array(16)); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    var h = Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
  }
  // B07 (web): UUID aleatorio persistido en localStorage; sin datos personales
  function deviceId() {
    try { var id = localStorage.getItem('nuclear.deviceId'); if (!id) { id = uuid(); localStorage.setItem('nuclear.deviceId', id); } return id; }
    catch (e) { return uuid(); }
  }
  function fmt(seg) { if (seg == null) return '--:--'; var m = Math.floor(seg / 60), s = seg % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
  function emit(tipo, datos) {
    fetch('/api/eventos', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tipo: tipo, sesion_id: sesion.id_sesion, dispositivo_id: deviceId(), datos: datos }) }).catch(function () {});
  }

  var MOTIVOS = {
    token_invalido: 'El código QR no es válido.',
    sesion_inexistente: 'No pudimos identificar el establecimiento.',
    sesion_cerrada: 'La sesión de este establecimiento ya terminó.',
    qr_desactivado: 'Este código QR está desactivado en este momento.'
  };

  function renderError(motivo) {
    app.innerHTML = brand() + '<div class="card err"><h1>Acceso no disponible</h1><p>' + esc(MOTIVOS[motivo] || 'No fue posible abrir el acceso. Intenta de nuevo.') +
      '</p><p>Escanea de nuevo el QR del establecimiento o pide ayuda al personal.</p></div>';
  }

  function renderHome() {
    app.innerHTML = brand() +
      '<span class="badge" style="margin-top:20px;display:inline-block">Acceso mediante QR</span>' +
      '<h1>¿Qué quieres escuchar?</h1><p>' + esc(sesion.establecimiento.nombre) + '</p>' +
      '<form id="f" class="row" role="search"><input id="q" type="search" autocomplete="off" placeholder="Busca una canción" aria-label="Buscar canción" maxlength="100">' +
      '<button type="submit" aria-label="Buscar">Buscar</button></form>' +
      '<div id="sug"></div><div id="res"></div>' +
      '<p class="privacy">Sin nombre, correo ni datos personales.</p>';
    var MIN_SUGERENCIA = 3, DEBOUNCE_MS = 450; // mismas medidas que la app Android (cuota de search.list)
    var q = document.getElementById('q'), sug = document.getElementById('sug'), res = document.getElementById('res'), timer, seq = 0;

    q.addEventListener('input', function () {
      clearTimeout(timer); var v = q.value.trim();
      if (v.length < MIN_SUGERENCIA) { sug.innerHTML = ''; return; }
      timer = setTimeout(function () {
        var mine = ++seq;
        fetch('/api/busqueda/sugerencias?q=' + encodeURIComponent(v)).then(function (r) { return r.ok ? r.json() : { sugerencias: [] }; })
          .then(function (j) {
            if (mine !== seq) return;
            sug.innerHTML = j.sugerencias.length ? '<ul class="sug">' + j.sugerencias.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul>' : '';
            Array.prototype.forEach.call(sug.querySelectorAll('li'), function (li) { li.addEventListener('click', function () { q.value = li.textContent; buscar(); }); });
          }).catch(function () {});
      }, DEBOUNCE_MS);
    });
    document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); buscar(); });

    function buscar() {
      var v = q.value.trim(); sug.innerHTML = ''; clearTimeout(timer); seq++; // cancela sugerencias pendientes
      if (v.length < 2) { res.innerHTML = '<p>Escribe al menos 2 caracteres.</p>'; return; }
      res.innerHTML = '<p>Buscando…</p>';
      fetch('/api/busqueda?q=' + encodeURIComponent(v)).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (o) {
          if (!o.ok) { res.innerHTML = '<div class="card err"><p>' + esc(o.j.error ? o.j.error.mensaje : 'Error al buscar.') + '</p></div>'; return; }
          var lista = o.j.resultados;
          emit('busqueda_realizada', { termino: v, cantidad_resultados: lista.length, desde_cache: false });
          res.innerHTML = lista.length ? lista.map(function (c) {
            return '<div class="song' + (c.disponibilidad === 'disponible' ? '' : ' nd') + '"><img src="' + esc(c.url_miniatura) + '" alt="" loading="lazy">' +
              '<div><div class="t">' + esc(c.titulo) + '</div><div class="m">' + esc(c.artista_canal) + ' · ' + fmt(c.duracion_segundos) +
              (c.disponibilidad === 'disponible' ? '' : ' · No disponible') + '</div></div></div>';
          }).join('') : '<p>No encontramos resultados para “' + esc(v) + '”.</p>';
        }).catch(function () { res.innerHTML = '<div class="card err"><p>Error de conexión. Reintenta.</p></div>'; });
    }
  }

  if (!token) { renderError('token_invalido'); return; }
  fetch('/api/sesiones/' + encodeURIComponent(token)).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (o) {
      if (!o.ok) { renderError(o.j.error && o.j.error.codigo); return; }
      sesion = o.j; renderHome();
      var recurrente = false;
      try { recurrente = !!localStorage.getItem('nuclear.visited'); localStorage.setItem('nuclear.visited', '1'); } catch (e) {}
      emit('dispositivo_unido', { recurrente: recurrente });
    }).catch(function () { renderError(); });
})();
</script>
</body>
</html>
